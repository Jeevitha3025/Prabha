kind = "web"
previewPath = "/"
title = "PRABHA"
description = "A voice-first, multilingual entrepreneurship companion for rural Indian women, with guided onboarding, opportunity matching, mentoring, schemes, and readiness support."
version = "1.0.0"
id = "artifacts/prabha"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24844

[services.development]
run = "pnpm --filter @workspace/prabha run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prabha", "run", "build" ]
serve = "static"
publicDir = "artifacts/prabha/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24844"
BASE_PATH = "/"
